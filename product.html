<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Product — Utility Store</title>
  <meta name="description" content="Product details, price comparison and verified buy links."/>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body>
  <main class="container">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="./index.html">Home</a><span class="sep">/</span>
      <a id="crumb-cat" href="./category.html">Catalog</a><span class="sep">/</span>
      <span id="crumb-title">Product</span>
    </nav>

    <div id="pdp-root">
      <div class="pdp">
        <div class="pdp-gallery">
          <div class="pdp-main-img skeleton" id="pdp-main-img"></div>
          <div class="pdp-thumbs" id="pdp-thumbs"></div>
        </div>
        <div class="pdp-info">
          <span class="po-type" id="pdp-brand-slot">Curated pick</span>
          <h1 id="pdp-title" class="skeleton" style="height:1.6rem;width:70%">&nbsp;</h1>
          <div class="pdp-rating-row" id="pdp-rating"></div>
          <div class="pdp-price-block skeleton" id="pdp-price-block" style="height:5rem"></div>
          <div id="pdp-options"></div>
          <div class="pdp-desc skeleton" id="pdp-desc" style="height:4rem"></div>
          <div class="pdp-actions" id="pdp-actions"></div>
          <div class="assure">
            <span class="as-item">✓ Checkout &amp; delivery by Meesho/Amazon</span>
            <span class="as-item">✓ Returns as per store policy</span>
            <span class="as-item">✓ Price-checked by our editors</span>
          </div>
        </div>
      </div>
      <section class="section" id="linked-posts"></section>
      <section class="section">
        <h2 class="section-title" style="margin-bottom:.75rem">Related products</h2>
        <div class="grid-products" id="related-grid"></div>
      </section>
    </div>
  </main>

  <!-- mobile sticky buy bar -->
  <div class="buy-bar" id="buy-bar"></div>

  <footer class="site-footer">
    <div class="footer-disclosure" id="footer-disclosure"></div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/affiliate.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script>
    window.BL.ui.renderHeader("shop");
    window.BL.ui.updateCartBadge();
    document.getElementById("footer-disclosure").textContent = window.BL.affiliate.DISCLOSURE;

    window.BL.catalog.renderPDP().then(() => {
      // sticky mobile buy bar mirrors the main CTAs
      const p = window.BL.data.getProduct(new URLSearchParams(location.search).get("p"));
      const bar = document.getElementById("buy-bar");
      if (p && bar) bar.appendChild(window.BL.affiliate.ctaButtons(p));
      // fill breadcrumb with product title
      const ct = document.getElementById("crumb-title");
      if (p && ct) ct.textContent = p.title;
    });
  </script>
</body>
</html>
