<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>Content Manager — Utility Store</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0a0a0b; color: #fafafa; font-family: Inter, system-ui, sans-serif; }
    .splash { text-align: center; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 1rem; border-radius: 50%;
               border: 3px solid #27272a; border-top-color: #3b82f6;
               animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #a1a1aa; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="splash">
    <div class="spinner"></div>
    <p>Loading content manager…</p>
  </div>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
