<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Review Article — UtilixVerse Store</title>
  <meta name="description" content="In-depth hands-on testing, verdict, pros and cons."/>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"/>
  <link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body>
  <main class="container">
    <div class="article-wrap" id="article-root">
      <nav class="crumbs" id="article-crumbs" aria-label="Breadcrumb"></nav>
      <h1 class="page-title" id="article-title" style="margin-top:0.75rem"></h1>
      <div class="po-meta" id="article-meta" style="margin-bottom:1.5rem;font-size:0.9rem"></div>

      <div id="article-top"></div>

      <img id="article-hero" src="" alt="" style="display:none;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-card);margin-bottom:2rem;border:1px solid var(--border);"/>

      <div class="article-body" id="article-body"></div>

      <div id="article-products"></div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/affiliate.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/post.js"></script>
  <script>
    window.BL.ui.renderHeader("reviews");
    window.BL.ui.renderFooter();
    window.BL.ui.updateCartBadge();
    window.BL.post.renderArticle();
  </script>
</body>
</html>
